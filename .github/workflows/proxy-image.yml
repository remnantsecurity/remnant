name: Build and push proxy image

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/proxy-image.yml'
      - 'crates/**'
      - 'integrations/npm-registry-proxy/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: integrations/npm-registry-proxy/Dockerfile
          build-args: |
            GIT_SHA=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/remnantsecurity/npm-registry-proxy:latest
            ghcr.io/remnantsecurity/npm-registry-proxy:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/remnantsecurity/npm-registry-proxy
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
