[package]
name = "remnant-npm-registry-proxy"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "remnant-npm-registry-proxy"
path = "src/main.rs"

[dependencies]
bytes = "1.11.0"
base64 = "0.22.1"
futures-util = "0.3.31"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "stream"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
