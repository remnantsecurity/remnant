[package]
name = "remnant-npm-registry-proxy"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace]

[[bin]]
name = "remnant-npm-registry-proxy"
path = "src/main.rs"

[dependencies]
axum = "0.8"
base64 = "0.22.1"
# RFC 3339 millisecond-precision timestamps for audit records. The standard library
# does not provide calendar date conversion from a Unix epoch. `default-features = false`
# disables serde and other optional features; `clock` provides `Utc::now()`. Transitive
# platform sub-crates (wasm-bindgen, js-sys, windows-core) appear in Cargo.lock as
# target-conditional deps of iana-time-zone and are not compiled for native targets.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
remnant-core = { path = "../../crates/remnant-core" }
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
flate2 = "1.1.9"
rcgen = { version = "0.13.2", default-features = false, features = ["pem", "ring"] }
tar = "0.4.46"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
