[package]
name = "remnant-npm-registry-proxy"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "remnant-npm-registry-proxy"
path = "src/main.rs"

[dependencies]
axum = "0.8"
bytes = "1.11.0"
base64 = "0.22.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3.31"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "stream"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
flate2 = "1.1.9"
rcgen = { version = "0.13.2", default-features = false, features = ["pem", "ring"] }
tar = "0.4.46"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
