[package]
name = "remnant-cli"
version = "0.1.3"
edition = "2024"
rust-version = "1.95"
description = "Deterministic npm artifact admission for local and CI supply-chain checks."
license = "MIT OR Apache-2.0"
repository = "https://github.com/remnantsecurity/remnant"
readme = "README.md"
keywords = ["npm", "supply-chain", "security", "cli", "artifacts"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/Cargo.toml",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.md",
    "/fixtures/**",
    "/src/**",
    "/tests/**",
]

[[bin]]
name = "remnant"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
flate2 = "1.1.9"
remnant-core = { path = "../remnant-core" }
serde_json = "1.0.145"
tar = "0.4.46"
tokio = { version = "1.48.0", features = ["net", "rt", "time"] }

[dev-dependencies]
rcgen = { version = "0.13.2", default-features = false, features = ["pem", "ring"] }
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt-multi-thread"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
