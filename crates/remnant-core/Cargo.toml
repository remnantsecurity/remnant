[package]
name = "remnant-core"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
description = "Shared artifact fetch and integrity verification library for Remnant."
license = "MIT OR Apache-2.0"
repository = "https://github.com/remnantsecurity/remnant"
readme = "README.md"
keywords = ["supply-chain", "security", "artifacts"]
categories = ["development-tools"]

[dependencies]
base64 = "0.22.1"
bytes = "1.11.0"
futures-util = "0.3.31"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.10.9"
tokio = { version = "1.48.0", default-features = false, features = ["time"] }

[dev-dependencies]
rcgen = { version = "0.13.2", default-features = false, features = ["pem", "ring"] }
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt-multi-thread"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
